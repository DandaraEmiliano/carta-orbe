spring.application.name=carta-orbe
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.whitelabel.enabled=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2100KB
server.tomcat.max-swallow-size=2100KB
server.tomcat.threads.max=32
management.endpoints.web.exposure.include=health
orbe.model.url=${ORBE_MODEL_URL:http://127.0.0.1:11434}
orbe.model.name=${ORBE_MODEL_NAME:llama3.2}
orbe.model.enabled=${ORBE_MODEL_ENABLED:true}
orbe.model.key=${ORBE_MODEL_KEY:}
orbe.access.code=${ORBE_ACCESS_CODE:}
spring.servlet.multipart.file-size-threshold=2MB
